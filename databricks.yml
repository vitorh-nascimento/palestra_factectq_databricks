# Databricks Asset Bundle (DAB) Configuration
# Projeto: Palestra Fatec Taquaritinga - Do cookie ao dashboard: Databricks & Carreira
# Autor: Vitor Hugo Nascimento (Lead Data Engineer)

bundle:
  name: palestra_factectq_databricks

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: "ID do SQL Warehouse para o AI/BI Dashboard"
    lookup:
      warehouse: "Serverless Starter Warehouse"

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
